# Generate the Xcode project with: xcodegen
name: MeteorShowerCountdown
options:
  bundleIdPrefix: com.ak.ship100
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 2S5U54K6L4
    CODE_SIGN_STYLE: Automatic
targets:
  MeteorShowerCountdown:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ak.ship100.meteorshowercountdown
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Meteors"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to work out where the meteor radiant sits in your sky and when it's dark. It never leaves your phone."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  MeteorShowerCountdownTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MeteorShowerCountdown
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ak.ship100.meteorshowercountdown.tests
schemes:
  MeteorShowerCountdown:
    build:
      targets:
        MeteorShowerCountdown: all
        MeteorShowerCountdownTests: [test]
    test:
      targets:
        - MeteorShowerCountdownTests
