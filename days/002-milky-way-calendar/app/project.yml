# Generate the Xcode project with: xcodegen
name: MilkyWayCalendar
options:
  bundleIdPrefix: com.ak.ship100
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 2S5U54K6L4
    CODE_SIGN_STYLE: Automatic
targets:
  MilkyWayCalendar:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ak.ship100.milkywaycalendar
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Milky Way"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to work out when the Milky Way core is up and the sky is dark where you are. It never leaves your phone."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  MilkyWayCalendarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MilkyWayCalendar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ak.ship100.milkywaycalendar.tests
schemes:
  MilkyWayCalendar:
    build:
      targets:
        MilkyWayCalendar: all
        MilkyWayCalendarTests: [test]
    test:
      targets:
        - MilkyWayCalendarTests
